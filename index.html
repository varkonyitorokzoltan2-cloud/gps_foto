<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPS Kamera</title>
  <!-- Tailwind CSS a modern UI stylinghoz -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome az ikonokhoz -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Speciális mobil nézet beállítások */
    body {
      background-color: #0f172a;
      color: #f8fafc;
      touch-action: manipulation;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    /* Tükrözés első kamera esetén */
    .mirror {
      transform: scaleX(-1);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden select-none">

<!-- Felső Fejléc / Státusz sáv -->
<header class="bg-slate-900/80 backdrop-blur-md p-4 flex justify-between items-center z-20 border-b border-slate-800">
  <div class="flex items-center space-x-2">
    <i class="fa-solid fa-camera-retro text-emerald-400 text-xl"></i>
    <h1 class="font-bold text-lg tracking-wide bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">
      GPS Kamera
    </h1>
  </div>
  <!-- Élő GPS Státusz Jelző -->
  <div id="gps-status" class="flex items-center space-x-2 text-xs bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
            <span class="relative flex h-2.5 w-2.5">
              <span id="gps-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
              <span id="gps-dot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500"></span>
            </span>
    <span id="gps-text" class="text-slate-300 font-medium">GPS keresése...</span>
  </div>
</header>

<!-- Fő tartalom / Kamera nézet -->
<main class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
  <!-- Kamera Élő Képe -->
  <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>

  <!-- Rejtett Canvas a kép feldolgozásához és feliratozásához -->
  <canvas id="photo-canvas" class="hidden"></canvas>

  <!-- Élő GPS overlay a videó felett (tájékoztatásul) -->
  <div id="live-overlay" class="absolute bottom-4 left-4 right-4 bg-black/60 backdrop-blur-md p-3 rounded-xl border border-white/10 text-xs text-slate-200 flex flex-col gap-1 pointer-events-none transition-opacity duration-300">
    <div class="flex justify-between items-center text-emerald-400 font-semibold border-b border-white/10 pb-1">
      <span id="overlay-date">----.--.-- --:--:--</span>
      <span id="overlay-acc">Pontosság: -- m</span>
    </div>
    <div class="font-mono text-xs pt-0.5">
      <span id="overlay-coords">SZÉL: --.-- | HOSSZ: --.--</span>
    </div>
    <div id="overlay-location" class="truncate text-slate-400 italic">
      Helyszín lekérése...
    </div>
  </div>

  <!-- Kamera hibaüzenet (ha nem elérhető a kamera) -->
  <div id="camera-error" class="hidden absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center p-6 text-center z-30">
    <i class="fa-solid fa-triangle-exclamation text-rose-500 text-5xl mb-4"></i>
    <h2 class="text-xl font-bold mb-2">Kamera hozzáférés megtagadva</h2>
    <p class="text-slate-400 text-sm mb-6 max-w-xs">A program használatához engedélyezned kell a kamera és a GPS használatát a böngészőben.</p>
    <button onclick="startApp()" class="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold rounded-lg shadow-lg transition-all">
      Újrapróbálás
    </button>
  </div>
</main>

<!-- Elsődleges Vezérlőgombok (Alsó sáv) -->
<footer class="bg-slate-900/90 backdrop-blur-md p-6 flex justify-around items-center z-20 border-t border-slate-800">
  <!-- Váltás az első/hátsó kamera között -->
  <button id="btn-switch-cam" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-200 transition-all active:scale-95">
    <i class="fa-solid fa-camera-rotate text-lg"></i>
  </button>

  <!-- Exponáló gomb (Fénykép készítése) -->
  <button id="btn-capture" class="w-20 h-20 rounded-full bg-slate-100 hover:bg-white p-1 flex items-center justify-center shadow-lg shadow-emerald-500/10 transition-all active:scale-90">
    <div class="w-full h-full rounded-full border-4 border-slate-900 bg-emerald-500 flex items-center justify-center">
      <i class="fa-solid fa-camera text-slate-950 text-2xl"></i>
    </div>
  </button>

  <!-- Galéria / Utolsó kép gyorsnézete -->
  <button id="btn-gallery" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-200 transition-all active:scale-95">
    <i class="fa-solid fa-image text-lg"></i>
  </button>
</footer>

<!-- Elkészült Kép Előnézeti Modális Ablak -->
<div id="preview-modal" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col justify-between p-4 backdrop-blur-lg">
  <!-- Fejléc a modális ablakban -->
  <div class="flex justify-between items-center pt-2 px-2">
    <span class="text-sm font-semibold text-slate-300">Fénykép előnézet</span>
    <button id="btn-close-preview" class="text-slate-400 hover:text-white p-2">
      <i class="fa-solid fa-xmark text-2xl"></i>
    </button>
  </div>

  <!-- A beégetett adatokkal ellátott végleges kép -->
  <div class="flex-1 flex items-center justify-center p-2 my-auto overflow-hidden">
    <img id="preview-img" class="max-h-full max-w-full object-contain rounded-lg shadow-2xl border border-slate-800" alt="GPS Fénykép">
  </div>

  <!-- Akció gombok: Mentés / Mégse -->
  <div class="flex gap-4 pb-4 px-2">
    <button id="btn-retake" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl border border-slate-700 transition-all flex items-center justify-center gap-2">
      <i class="fa-solid fa-trash-can"></i> Elvetés
    </button>
    <a id="btn-download" download="gps-photo.jpg" class="flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 text-center cursor-pointer">
      <i class="fa-solid fa-download"></i> Mentés telefonra
    </a>
  </div>
</div>

<!-- Alkalmazás Logika -->
<script>
  // Globális változók és állapotok
  let currentStream = null;
  let facingMode = "environment"; // Alapértelmezetten a hátsó kamera
  let gpsData = {
    latitude: null,
    longitude: null,
    accuracy: null,
    address: "Helyszín meghatározása folyamatban...",
    timestamp: null
  };
  let lastCapturedImage = null;

  // DOM Elemek
  const webcam = document.getElementById("webcam");
  const canvas = document.getElementById("photo-canvas");
  const cameraError = document.getElementById("camera-error");

  // GPS UI elemek
  const gpsStatus = document.getElementById("gps-status");
  const gpsDot = document.getElementById("gps-dot");
  const gpsPing = document.getElementById("gps-ping");
  const gpsText = document.getElementById("gps-text");

  // Overlay elemek
  const overlayDate = document.getElementById("overlay-date");
  const overlayAcc = document.getElementById("overlay-acc");
  const overlayCoords = document.getElementById("overlay-coords");
  const overlayLocation = document.getElementById("overlay-location");

  // Modális elemek
  const previewModal = document.getElementById("preview-modal");
  const previewImg = document.getElementById("preview-img");
  const btnDownload = document.getElementById("btn-download");

  // 1. App indítása
  async function startApp() {
    cameraError.classList.add("hidden");
    await initCamera();
    initGeolocation();
    startClock();
  }

  // 2. Kamera inicializálása
  async function initCamera() {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
    }

    const constraints = {
      video: {
        facingMode: facingMode,
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    };

    try {
      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      webcam.srcObject = currentStream;

      // Tükrözés igazítása első kameránál
      if (facingMode === "user") {
        webcam.classList.add("mirror");
      } else {
        webcam.classList.remove("mirror");
      }
    } catch (err) {
      console.error("Kamera hiba:", err);
      cameraError.classList.remove("hidden");
    }
  }

  // Kamera váltása (első/hátsó)
  document.getElementById("btn-switch-cam").addEventListener("click", () => {
    facingMode = (facingMode === "environment") ? "user" : "environment";
    initCamera();
  });

  // 3. Geolocation (GPS) inicializálása és folyamatos figyelése
  function initGeolocation() {
    if (!navigator.geolocation) {
      updateGPSUI(false, "GPS nem támogatott");
      return;
    }

    const options = {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    };

    navigator.geolocation.watchPosition(
      (position) => {
        gpsData.latitude = position.coords.latitude;
        gpsData.longitude = position.coords.longitude;
        gpsData.accuracy = position.coords.accuracy;
        gpsData.timestamp = new Date();

        updateGPSUI(true, `Pontos: ±${Math.round(gpsData.accuracy)}m`);
        updateLiveOverlay();

        // Helyszín név lekérése (Reverse Geocoding)
        fetchAddress(gpsData.latitude, gpsData.longitude);
      },
      (error) => {
        console.warn("GPS Hiba:", error);
        updateGPSUI(false, "Nincs GPS jel");
      },
      options
    );
  }

  // GPS Státusz UI frissítése
  function updateGPSUI(isSuccess, message) {
    gpsText.textContent = message;
    if (isSuccess) {
      gpsDot.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500";
      gpsPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75";
    } else {
      gpsDot.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500";
      gpsPing.className = "hidden";
    }
  }

  // Reverse Geocoding: Koordináták átváltása címmé (OpenStreetMap Nominatim API)
  let lastFetchTime = 0;
  async function fetchAddress(lat, lon) {
    // Csak 10 másodpercenként kérünk le új címet, hogy ne terheljük az API-t
    const now = Date.now();
    if (now - lastFetchTime < 10000) return;
    lastFetchTime = now;

    try {
      const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`, {
        headers: { 'Accept-Language': 'hu' }
      });
      const data = await response.json();

      if (data && data.address) {
        const city = data.address.city || data.address.town || data.address.village || data.address.county || "";
        const road = data.address.road || data.address.pedestrian || "";
        const houseNumber = data.address.house_number || "";

        let addressParts = [city, road, houseNumber].filter(Boolean);
        gpsData.address = addressParts.length > 0 ? addressParts.join(", ") : data.display_name;
        overlayLocation.textContent = gpsData.address;
      }
    } catch (err) {
      console.error("Címlekérési hiba:", err);
      gpsData.address = "Helyszínnév nem elérhető";
    }
  }

  // Élő óra és overlay frissítés
  function startClock() {
    setInterval(() => {
      const now = new Date();
      const formattedDate = formatDate(now);
      overlayDate.textContent = formattedDate;
    }, 1000);
  }

  function updateLiveOverlay() {
    if (gpsData.latitude && gpsData.longitude) {
      overlayCoords.textContent = `SZÉL: ${gpsData.latitude.toFixed(5)}° | HOSSZ: ${gpsData.longitude.toFixed(5)}°`;
      overlayAcc.textContent = `Pontosság: ±${Math.round(gpsData.accuracy)}m`;
    }
  }

  function formatDate(date) {
    if (!date) date = new Date();
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    return `${year}.${month}.${day}. ${hours}:${minutes}:${seconds}`;
  }

  // 4. Fénykép Készítése és Rávezetés a Canvas-ra
  document.getElementById("btn-capture").addEventListener("click", capturePhoto);

  function capturePhoto() {
    if (!webcam.videoWidth) return;

    // Canvas méretezése a kamera valós felbontásához
    canvas.width = webcam.videoWidth;
    canvas.height = webcam.videoHeight;
    const ctx = canvas.getContext("2d");

    // Kép kirajzolása (tükrözés kezelése ha első kamera)
    ctx.save();
    if (facingMode === "user") {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    // GPS Rávetítés (Overlay rászerkesztése a képre)
    drawStamp(ctx, canvas.width, canvas.height);

    // Kép exportálása Data URL formátumban (JPG)
    const imageDataUrl = canvas.toDataURL("image/jpeg", 0.92);
    lastCapturedImage = imageDataUrl;

    // Előnézeti ablak megjelenítése
    previewImg.src = imageDataUrl;

    // Fájlnév generálása a mentéshez
    const timeStampForFile = new Date().toISOString().replace(/[:.]/g, "-");
    btnDownload.href = imageDataUrl;
    btnDownload.download = `GPS_PHOTO_${timeStampForFile}.jpg`;

    previewModal.classList.remove("hidden");
  }

  // Vízjel / Stamped adatok kirajzolása a képre
  function drawStamp(ctx, width, height) {
    // Dinamikus skálázás a felbontáshoz képest
    const baseFontSize = Math.max(16, Math.floor(width / 40));
    const padding = baseFontSize;
    const overlayHeight = baseFontSize * 5.5;

    // Fekete áttetsző háttérsáv a kép alján
    ctx.fillStyle = "rgba(15, 23, 42, 0.75)";
    ctx.fillRect(0, height - overlayHeight, width, overlayHeight);

    // Keret / Elválasztó vonal
    ctx.fillStyle = "#10b981"; // Emerald színű akcentus vonal
    ctx.fillRect(0, height - overlayHeight, width, Math.max(3, Math.floor(baseFontSize / 6)));

    // Szöveg formázása
    ctx.fillStyle = "#ffffff";
    ctx.font = `bold ${baseFontSize * 1.1}px sans-serif`;
    ctx.textBaseline = "top";

    const startY = height - overlayHeight + padding / 1.5;

    // 1. Sor: Dátum és idő + Pontosság
    const dateStr = formatDate(new Date());
    const accStr = gpsData.accuracy ? ` (±${Math.round(gpsData.accuracy)}m)` : '';
    ctx.fillText(`${dateStr}${accStr}`, padding, startY);

    // 2. Sor: GPS Koordináták
    ctx.font = `monospaced ${baseFontSize}px monospace`;
    ctx.fillStyle = "#6ee7b7"; // Light emerald
    const latStr = gpsData.latitude ? gpsData.latitude.toFixed(6) : "N/A";
    const lonStr = gpsData.longitude ? gpsData.longitude.toFixed(6) : "N/A";
    ctx.fillText(`GPS: ${latStr}, ${lonStr}`, padding, startY + baseFontSize * 1.4);

    // 3. Sor: Helyszín neve (Cím)
    ctx.font = `italic ${baseFontSize * 0.9}px sans-serif`;
    ctx.fillStyle = "#cbd5e1";
    const addressText = gpsData.address || "Helyszín ismeretlen";

    // Cím levágása ha túl hosszú
    let truncatedAddress = addressText;
    if (ctx.measureText(truncatedAddress).width > width - (padding * 2)) {
      while (ctx.measureText(truncatedAddress + "...").width > width - (padding * 2) && truncatedAddress.length > 0) {
        truncatedAddress = truncatedAddress.slice(0, -1);
      }
      truncatedAddress += "...";
    }
    ctx.fillText(truncatedAddress, padding, startY + baseFontSize * 2.8);
  }

  // Modális kezelők
  document.getElementById("btn-close-preview").addEventListener("click", () => {
    previewModal.classList.add("hidden");
  });

  document.getElementById("btn-retake").addEventListener("click", () => {
    previewModal.classList.add("hidden");
  });

  document.getElementById("btn-gallery").addEventListener("click", () => {
    if (lastCapturedImage) {
      previewModal.classList.remove("hidden");
    }
  });

  // Alkalmazás indítása az oldal betöltésekor
  window.addEventListener("load", startApp);
</script>
</body>
</html>
